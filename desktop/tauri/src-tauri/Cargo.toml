[package]
name = "sumi"
version = "0.4.1"
edition = "2021"
rust-version = "1.100"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
tauri-plugin-updater = "=2.10.0"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "=2.0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
windows-sys = { version = "0.61", features = [
  "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading",
  "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
