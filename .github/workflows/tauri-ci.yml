name: Tauri native build and smoke

"on":
  pull_request:
  push:
    # `electron` is the repository's default branch (historical name).
    branches: [electron]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Tauri (${{ matrix.target.id }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: macos-arm64
            os: macos-15
            platform: darwin
            arch: arm64
            rust-host: aarch64-apple-darwin
          - id: macos-x64
            os: macos-15-intel
            platform: darwin
            arch: x64
            rust-host: x86_64-apple-darwin
          - id: windows-x64
            os: windows-2025
            platform: win32
            arch: x64
            rust-host: x86_64-pc-windows-msvc
          - id: linux-x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
            rust-host: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          # Match the bundled Node ABI used by better-sqlite3 and the native voice probe.
          node-version: 26.13.1
          architecture: ${{ matrix.target.arch }}
          cache: pnpm

      - name: Require matching native runner, Node, and Rust
        env:
          EXPECTED_PLATFORM: ${{ matrix.target.platform }}
          EXPECTED_ARCH: ${{ matrix.target.arch }}
          EXPECTED_RUST_HOST: ${{ matrix.target.rust-host }}
          HOST_ARCH: ${{ runner.arch }}
        run: |
          test "$(printf '%s' "$HOST_ARCH" | tr '[:upper:]' '[:lower:]')" = "$EXPECTED_ARCH"
          node -e 'const assert = require("node:assert/strict"); assert.equal(process.platform, process.env.EXPECTED_PLATFORM); assert.equal(process.arch, process.env.EXPECTED_ARCH);'
          rustup update stable --no-self-update
          rustup override set stable
          test "$(rustc -vV | awk '/^host: / {print $2}' | tr -d '\r')" = "$EXPECTED_RUST_HOST"

      - name: Install Linux WebKitGTK and Xvfb dependencies
        if: matrix.target.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 dbus-x11 xvfb xauth
          pkg-config --exists gtk+-3.0 webkit2gtk-4.1

      - run: pnpm install --frozen-lockfile

      - name: Test runner and WebView bridge
        if: matrix.target.platform != 'darwin'
        run: node --test desktop/tauri/run.test.mjs desktop/tauri/bridge.test.mjs desktop/tauri/release-manifest.test.mjs

      - name: Check owned files and workflow formatting
        if: matrix.target.platform == 'linux'
        run: pnpm exec prettier --check .github/workflows/tauri-ci.yml .github/workflows/release.yml desktop/tauri/{run.mjs,run.test.mjs,release-manifest.mjs}

      - name: Stage native backend and build packages
        run: pnpm tauri:build

      - name: Smoke macOS app bundle
        if: matrix.target.platform == 'darwin'
        run: |
          node --test desktop/tauri/bridge.test.mjs
          pnpm tauri:check

      - name: Smoke Windows standalone and NSIS-installed application
        if: matrix.target.platform == 'win32'
        shell: pwsh
        run: |
          node desktop/tauri/run.mjs check
          if ($LASTEXITCODE -ne 0) { throw 'Standalone smoke failed' }
          $release = 'desktop/tauri/src-tauri/target/release'
          $config = Get-Content desktop/tauri/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $installerName = '{0}_{1}_x64-setup.exe' -f $config.productName, $config.version
          $installer = Join-Path "$release/bundle/nsis" $installerName
          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Missing NSIS package: $installer" }
          $install = Join-Path $env:RUNNER_TEMP ('sumi-nsis-' + [guid]::NewGuid())
          try {
            # Do not ask the installer to run the app. /D must come last and must not be quoted.
            $setup = Start-Process -FilePath $installer -ArgumentList "/S /NS /D=$install" -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "NSIS installer exited $($setup.ExitCode)" }
            node desktop/tauri/run.mjs check (Join-Path $install ($config.mainBinaryName + '.exe'))
            if ($LASTEXITCODE -ne 0) { throw 'NSIS-installed smoke failed' }
          } finally {
            if (Test-Path -LiteralPath $install) { Remove-Item -LiteralPath $install -Recurse -Force }
          }

      - name: Smoke installed Debian package and AppImage
        if: matrix.target.platform == 'linux'
        env:
          # Xvfb has no GPU/DMABUF support; keep the WebKit sandbox enabled.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          packages=(desktop/tauri/src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          test -s "${packages[0]}"
          sudo apt-get install -y "./${packages[0]}"
          test -x /usr/bin/sumi
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x960x24' node desktop/tauri/run.mjs check /usr/bin/sumi
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x960x24' node desktop/tauri/run.mjs check
